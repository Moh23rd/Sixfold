name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: axe-light
            files: tests/axe-light.spec.js
          - group: axe-dark
            files: tests/axe-dark.spec.js
          - group: axe-states
            files: tests/axe-states.spec.js
          - group: core
            files: tests/smoke.spec.js tests/cache-footprint.spec.js tests/cache-footprint-drift.spec.js tests/whats-new.spec.js tests/language-count.spec.js tests/release-labels.spec.js
          - group: games
            files: tests/layout.spec.js tests/progressive-blur.spec.js tests/wordle.spec.js tests/haptics.spec.js tests/display-font.spec.js tests/palette-order.spec.js tests/share.spec.js tests/share-locales.spec.js tests/save.spec.js tests/perf-lite.spec.js
          - group: responsive
            files: tests/landscape.spec.js tests/backup.spec.js tests/appearance.spec.js tests/sizing.spec.js tests/stretch.spec.js
    name: Playwright ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify every Playwright spec is assigned
        run: |
          assigned=$(grep -E '^[[:space:]]+files:' .github/workflows/test.yml | sed 's/.*files:[[:space:]]*//' | tr '\n' ' ')
          for spec in tests/*.spec.js; do
            case " $assigned " in
              *" $spec "*) ;;
              *)
                echo "::error file=$spec::Playwright spec is not assigned to a CI group"
                exit 1
                ;;
            esac
          done
          echo "All Playwright specs are assigned to a CI group."
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit localization catalogs
        run: npm run test:i18n
      - name: Audit Wordle dictionaries
        run: npm run audit:wordle
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ matrix.files }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload locale cache footprints
        if: success() && matrix.group == 'core'
        uses: actions/upload-artifact@v7
        with:
          name: locale-cache-footprints-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/locale-cache-footprints.json
          if-no-files-found: error
          retention-days: 90
      - name: Download previous locale cache footprints
        id: previous-footprints
        if: success() && matrix.group == 'core'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p previous-footprints

          # Prefer the latest successful run on this branch. A new branch falls
          # back to the default branch so its first run still has a baseline.
          find_baseline() {
            local branch="$1"
            local run_id artifact runs_file
            runs_file=$(mktemp)
            if ! gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --branch "$branch" --status success --limit 50 \
              --json databaseId --jq ".[] | select(.databaseId != ${CURRENT_RUN_ID}) | .databaseId" > "$runs_file"; then
              echo "::error title=Cache footprint baseline lookup failed::Could not list successful runs on ${branch}."
              rm -f "$runs_file"
              return 2
            fi
            while read -r run_id; do
              [ -n "$run_id" ] || continue
              if ! artifact=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("locale-cache-footprints-"))] | sort_by(.created_at) | reverse | .[0].name // empty'); then
                echo "::error title=Cache footprint baseline lookup failed::Could not list artifacts for run ${run_id}."
                rm -f "$runs_file"
                return 2
              fi
              if [ -n "$artifact" ]; then
                echo "Comparing against ${artifact} from run ${run_id} on ${branch}."
                if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir previous-footprints; then
                  echo "::error title=Cache footprint baseline lookup failed::Could not download ${artifact} from run ${run_id}."
                  rm -f "$runs_file"
                  return 2
                fi
                rm -f "$runs_file"
                return 0
              fi
            done < "$runs_file"
            rm -f "$runs_file"
            return 1
          }

          default_branch="${DEFAULT_BRANCH:-main}"
          if find_baseline "$BRANCH"; then
            echo "baseline=true" >> "$GITHUB_OUTPUT"
          else
            branch_status=$?
            if [ "$branch_status" -eq 2 ]; then
              exit 1
            fi
            if [ "$BRANCH" != "$default_branch" ] && find_baseline "$default_branch"; then
              echo "baseline=true" >> "$GITHUB_OUTPUT"
            else
              default_status=$?
              if [ "$default_status" -eq 2 ]; then
                exit 1
              fi
              echo "::warning title=Cache footprint baseline unavailable::No earlier successful run with a locale-cache-footprints artifact was found; this run establishes the baseline."
              echo "baseline=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Check locale cache footprint drift
        if: success() && matrix.group == 'core'
        env:
          BASELINE: ${{ steps.previous-footprints.outputs.baseline }}
        run: |
          set -euo pipefail
          if [ "$BASELINE" != "true" ]; then
            echo "No previous footprint artifact; baseline run only."
            {
              echo '## Locale cache footprint drift'
              echo ''
              echo 'No previous footprint artifact was available, so this run establishes the baseline.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          current=$(find test-results -name locale-cache-footprints.json -print -quit)
          previous=$(find previous-footprints -name locale-cache-footprints.json -print -quit)
          test -n "$current"
          test -n "$previous"
          node scripts/check-cache-footprint-drift.mjs --current "$current" --previous "$previous"

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - name: Configure stable test signing
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_TEST_KEYSTORE_BASE64 ANDROID_TEST_KEYSTORE_PASSWORD ANDROID_TEST_KEY_ALIAS ANDROID_TEST_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in repository secrets"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/sixfold-ci-test.p12"
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 -d > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          {
            echo "ANDROID_TEST_KEYSTORE_PATH=$keystore"
            echo "ANDROID_TEST_KEYSTORE_PASSWORD=$ANDROID_TEST_KEYSTORE_PASSWORD"
            echo "ANDROID_TEST_KEY_ALIAS=$ANDROID_TEST_KEY_ALIAS"
            echo "ANDROID_TEST_KEY_PASSWORD=$ANDROID_TEST_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build debug APK
        run: npm run native:apk:debug
      - name: Verify APK signing
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk"
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          certs=$(mktemp)
          trap 'rm -f "$certs"' EXIT
          "$apksigner" verify --print-certs "$apk" | tee "$certs"
          grep -q 'CN=Sixfold CI Test' "$certs"
      - name: Verify APK contents
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          listing=$(mktemp)
          trap 'rm -f "$listing"' EXIT
          unzip -l "$apk" > "$listing"
          grep -q 'assets/public/index.html' "$listing"
          grep -q 'assets/public/native-plugins.js' "$listing"
          ls -lh "$apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sixfold-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Android emulator smoke
    runs-on: ubuntu-latest
    # A cold run downloads the emulator and its system image before it boots
    # anything; the cache makes later runs short, but the first one needs room.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      # The APK job proves the artifact is signed and complete; this job is the
      # only one that opens it. Build here without the signing secrets so the
      # debug keystore is used: installability is all the emulator needs.
      - name: Build debug APK
        run: npm run native:apk:debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A cold run downloads the emulator and a 1.2 GB system image, which is
      # most of this job's wall clock. The script only installs what is missing,
      # so caching those two directories is enough to skip the download.
      - name: Cache the emulator and its system image
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images
          key: emulator-api34-google_apis-x86_64-v1
      # Plain SDK tooling rather than an emulator action: the boot, the install
      # and the assertions are the same commands a workstation runs, so a
      # failure here can be reproduced instead of guessed at.
      - name: Boot emulator, install and assert the shell
        env:
          API_LEVEL: '34'
        run: bash scripts/android-emulator-smoke.sh
      - name: Keep a failed launch's logcat and screen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-failure
          path: emulator-failure/
          if-no-files-found: ignore
          retention-days: 14

  native:
    name: native pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The shells are generated, so this job builds them first and then proves
      # every pin and every precached byte against the source tree. It fails in
      # about a minute, instead of at the end of an APK build.
      - name: Build the shell and verify every pin and asset
        run: |
          npm run native:build
          npm run native:check

  check:
    name: check
    needs: [test, android, native, emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify Playwright, Android builds and the emulator smoke passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          EMULATOR_RESULT: ${{ needs.emulator.result }}
        run: |
          echo "Playwright matrix: $TEST_RESULT"
          echo "Android APK: $ANDROID_RESULT"
          echo "Native pins: $NATIVE_RESULT"
          echo "Android emulator: $EMULATOR_RESULT"
          test "$TEST_RESULT" = "success"
          test "$ANDROID_RESULT" = "success"
          test "$NATIVE_RESULT" = "success"
          test "$EMULATOR_RESULT" = "success"
