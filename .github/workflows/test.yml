name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: axe-light
            files: tests/axe-light.spec.js
          - group: axe-dark
            files: tests/axe-dark.spec.js
          - group: axe-states
            files: tests/axe-states.spec.js
          - group: core
            files: tests/smoke.spec.js tests/cache-footprint.spec.js tests/cache-footprint-drift.spec.js tests/whats-new.spec.js tests/language-count.spec.js tests/release-labels.spec.js
          - group: games
            files: tests/layout.spec.js tests/wordle.spec.js tests/display-font.spec.js tests/palette-order.spec.js tests/share.spec.js tests/share-locales.spec.js
    name: Playwright ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify every Playwright spec is assigned
        run: |
          assigned=$(grep -E '^[[:space:]]+files:' .github/workflows/test.yml | sed 's/.*files:[[:space:]]*//' | tr '\n' ' ')
          for spec in tests/*.spec.js; do
            case " $assigned " in
              *" $spec "*) ;;
              *)
                echo "::error file=$spec::Playwright spec is not assigned to a CI group"
                exit 1
                ;;
            esac
          done
          echo "All Playwright specs are assigned to a CI group."
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit localization catalogs
        run: npm run test:i18n
      - name: Audit Wordle dictionaries
        run: npm run audit:wordle
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ matrix.files }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload locale cache footprints
        if: success() && matrix.group == 'core'
        uses: actions/upload-artifact@v7
        with:
          name: locale-cache-footprints-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/locale-cache-footprints.json
          if-no-files-found: error
          retention-days: 90
      - name: Download previous locale cache footprints
        id: previous-footprints
        if: success() && matrix.group == 'core'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p previous-footprints

          # Prefer the latest successful run on this branch. A new branch falls
          # back to the default branch so its first run still has a baseline.
          find_baseline() {
            local branch="$1"
            local run_id artifact runs_file
            runs_file=$(mktemp)
            if ! gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --branch "$branch" --status success --limit 50 \
              --json databaseId --jq ".[] | select(.databaseId != ${CURRENT_RUN_ID}) | .databaseId" > "$runs_file"; then
              echo "::error title=Cache footprint baseline lookup failed::Could not list successful runs on ${branch}."
              rm -f "$runs_file"
              return 2
            fi
            while read -r run_id; do
              [ -n "$run_id" ] || continue
              if ! artifact=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("locale-cache-footprints-"))] | sort_by(.created_at) | reverse | .[0].name // empty'); then
                echo "::error title=Cache footprint baseline lookup failed::Could not list artifacts for run ${run_id}."
                rm -f "$runs_file"
                return 2
              fi
              if [ -n "$artifact" ]; then
                echo "Comparing against ${artifact} from run ${run_id} on ${branch}."
                if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir previous-footprints; then
                  echo "::error title=Cache footprint baseline lookup failed::Could not download ${artifact} from run ${run_id}."
                  rm -f "$runs_file"
                  return 2
                fi
                rm -f "$runs_file"
                return 0
              fi
            done < "$runs_file"
            rm -f "$runs_file"
            return 1
          }

          default_branch="${DEFAULT_BRANCH:-main}"
          if find_baseline "$BRANCH"; then
            echo "baseline=true" >> "$GITHUB_OUTPUT"
          else
            branch_status=$?
            if [ "$branch_status" -eq 2 ]; then
              exit 1
            fi
            if [ "$BRANCH" != "$default_branch" ] && find_baseline "$default_branch"; then
              echo "baseline=true" >> "$GITHUB_OUTPUT"
            else
              default_status=$?
              if [ "$default_status" -eq 2 ]; then
                exit 1
              fi
              echo "::warning title=Cache footprint baseline unavailable::No earlier successful run with a locale-cache-footprints artifact was found; this run establishes the baseline."
              echo "baseline=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Check locale cache footprint drift
        if: success() && matrix.group == 'core'
        env:
          BASELINE: ${{ steps.previous-footprints.outputs.baseline }}
        run: |
          set -euo pipefail
          if [ "$BASELINE" != "true" ]; then
            echo "No previous footprint artifact; baseline run only."
            {
              echo '## Locale cache footprint drift'
              echo ''
              echo 'No previous footprint artifact was available, so this run establishes the baseline.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          current=$(find test-results -name locale-cache-footprints.json -print -quit)
          previous=$(find previous-footprints -name locale-cache-footprints.json -print -quit)
          test -n "$current"
          test -n "$previous"
          node scripts/check-cache-footprint-drift.mjs --current "$current" --previous "$previous"

  check:
    name: check
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Playwright shards passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "Playwright matrix: $RESULT"
          test "$RESULT" = "success"
