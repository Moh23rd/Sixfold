name: Release APK

# A version tag is the release trigger. The Test workflow runs on the same tag;
# this workflow waits for that run before publishing anything, so a red commit
# cannot produce a downloadable release APK.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    name: Verify tag tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for the tag's Test run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 24); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow test.yml \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 20 \
              --json databaseId,headBranch \
              --jq "first(.[] | select(.headBranch == \"$TAG\") | .databaseId) // empty" \
              2>/dev/null || true)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error title=Release gate::No Test workflow run was found for tag $TAG."
            exit 1
          fi
          echo "Watching Test run $run_id for $TAG."
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

  release:
    name: Build and attach APK
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The shell-pin guard compares a file's last commit with the commit
          # that set its ?v= pin, so it needs the full tag history.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - name: Build the native shell
        run: npm run native:android
      - name: Verify shell pins and local assets
        run: npm run preflight
      - name: Configure stable test signing
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_TEST_KEYSTORE_BASE64 ANDROID_TEST_KEYSTORE_PASSWORD ANDROID_TEST_KEY_ALIAS ANDROID_TEST_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in repository secrets"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/sixfold-ci-test.p12"
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 -d > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          {
            echo "ANDROID_TEST_KEYSTORE_PATH=$keystore"
            echo "ANDROID_TEST_KEYSTORE_PASSWORD=$ANDROID_TEST_KEYSTORE_PASSWORD"
            echo "ANDROID_TEST_KEY_ALIAS=$ANDROID_TEST_KEY_ALIAS"
            echo "ANDROID_TEST_KEY_PASSWORD=$ANDROID_TEST_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build signed test APK
        run: npm run native:apk:debug
      - name: Verify APK signing
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk"
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          certs=$(mktemp)
          trap 'rm -f "$certs"' EXIT
          "$apksigner" verify --print-certs "$apk" | tee "$certs"
          grep -q 'CN=Sixfold CI Test' "$certs"
      - name: Verify APK contents
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          listing=$(mktemp)
          trap 'rm -f "$listing"' EXIT
          unzip -l "$apk" > "$listing"
          grep -q 'assets/public/index.html' "$listing"
          grep -q 'assets/public/native-plugins.js' "$listing"
          grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml' "$listing"
          grep -q 'res/mipmap-anydpi-v26/ic_launcher_round.xml' "$listing"
          if grep -Eq 'res/mipmap-(ar|hi|kn|han)([-/])' "$listing"; then
            echo "::error::the APK contains a locale-qualified launcher resource"
            exit 1
          fi
          ls -lh "$apk"
      - name: Attach APK to the matching Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          asset_name="sixfold-${TAG#v}.apk"
          asset="$RUNNER_TEMP/$asset_name"
          cp "$apk" "$asset"
          sha256sum "$asset" | tee "$RUNNER_TEMP/$asset_name.sha256"

          # The tag is pushed before the GitHub Release exists. Preserve a
          # release if one was already prepared (published or draft), otherwise
          # create a normal release with generated notes so the asset has a
          # stable home.
          release_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" \
            2>/dev/null || true)
          release_id=${release_id%%$'\n'*}
          if [ -z "$release_id" ]; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Sixfold ${TAG#v}" \
              --generate-notes
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          fi
          test -n "$release_id"

          # Make a workflow rerun replace the APK rather than fail on an
          # existing same-named asset. Draft releases are supported because the
          # upload targets the release id directly.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq ".[] | select(.name == \"$asset_name\") | .id" \
            2>/dev/null || true)
          for id in $existing; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done

          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$asset" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset_name"
